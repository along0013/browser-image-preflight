<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser Image Preflight</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #12231f; background: #f4f8f6; }
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { margin-bottom: 8px; } .lede { color: #526069; }
    .card { margin-top: 24px; padding: 22px; border: 1px solid #cfe0d9; border-radius: 16px; background: #fff; }
    input, button { font: inherit; } input { width: 100%; } button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 9px; color: #fff; background: #0b8b6b; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; } dl { display: grid; grid-template-columns: 150px 1fr; gap: 10px 16px; } dt { font-weight: 700; } dd { margin: 0; overflow-wrap: anywhere; }
    img { display: block; width: 100%; max-height: 460px; margin-top: 20px; object-fit: contain; background: repeating-conic-gradient(#edf2f0 0% 25%,#fff 0% 50%) 50% / 20px 20px; }
    .notice { font-size: .92rem; color: #526069; }
    @media (max-width: 520px) { body { padding: 22px 16px 48px; } dl { grid-template-columns: 1fr; gap: 4px; } }
  </style>
</head>
<body>
  <h1>Browser Image Preflight</h1>
  <p class="lede">Inspect an image locally before you edit it. Your file stays in this browser.</p>

  <section class="card" aria-labelledby="select-title">
    <h2 id="select-title">Choose an image</h2>
    <input id="fileInput" type="file" accept="image/*">
    <p class="notice">Use images you own or are authorized to edit.</p>
  </section>

  <section class="card" id="details" hidden aria-labelledby="details-title">
    <h2 id="details-title">File details</h2>
    <dl>
      <dt>File name</dt><dd id="name"></dd>
      <dt>MIME type</dt><dd id="type"></dd>
      <dt>File size</dt><dd id="size"></dd>
      <dt>Pixel dimensions</dt><dd id="dimensions"></dd>
    </dl>
    <img id="preview" alt="Selected image preview">
    <button id="download" type="button">Export as PNG</button>
    <p class="notice" id="status" hidden aria-live="polite"></p>
  </section>

  <script>
    const input = document.querySelector('#fileInput');
    const details = document.querySelector('#details');
    const preview = document.querySelector('#preview');
    const download = document.querySelector('#download');
    const status = document.querySelector('#status');
    let currentFile;

    const formatBytes = bytes => {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    };

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      currentFile = file;
      document.querySelector('#name').textContent = file.name;
      document.querySelector('#type').textContent = file.type || 'Not supplied by the browser';
      document.querySelector('#size').textContent = formatBytes(file.size);

      const url = URL.createObjectURL(file);
      preview.onload = () => {
        document.querySelector('#dimensions').textContent = `${preview.naturalWidth} × ${preview.naturalHeight}`;
        details.hidden = false;
        URL.revokeObjectURL(url);
      };
      preview.src = url;
    });

    download.addEventListener('click', () => {
      if (!currentFile || !preview.naturalWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = preview.naturalWidth;
      canvas.height = preview.naturalHeight;
      canvas.getContext('2d').drawImage(preview, 0, 0);
      canvas.toBlob(blob => {
        if (!blob) {
          // toBlob returns null when the browser cannot encode the canvas
          // (oversized image, out of memory). Say so instead of downloading nothing.
          status.textContent = 'This browser could not export the image. The file on disk is untouched.';
          status.hidden = false;
          return;
        }
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `${currentFile.name.replace(/\.[^.]+$/, '') || 'image'}-preflight.png`;
        link.click();
        // Revoke on a timer: releasing the URL in the same tick can cancel the
        // download before the browser has read it.
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        status.textContent = `Exported a ${canvas.width} × ${canvas.height} PNG of ${currentFile.name}. Nothing was uploaded.`;
        status.hidden = false;
      }, 'image/png');
    });
  </script>
</body>
</html>
